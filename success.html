<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(-45deg,#ff6ec4,#7873f5,#4facfe,#43e97b);
background-size:400% 400%;
animation:bgMove 10s infinite alternate;

overflow:hidden;

}

@keyframes bgMove{

0%{background-position:left;}
100%{background-position:right;}

}

.card{

width:550px;

padding:50px;

text-align:center;

background:rgba(255,255,255,.2);

backdrop-filter:blur(18px);

border-radius:25px;

box-shadow:0 0 30px rgba(0,0,0,.3);

animation:zoom 1s;

}

@keyframes zoom{

from{
transform:scale(.5);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}

h1{

font-size:60px;

color:white;

text-shadow:3px 3px 8px black;

margin-bottom:20px;

}

h2{

font-size:35px;

color:white;

margin-bottom:20px;

}

p{

font-size:25px;

color:white;

line-height:40px;

}

.emoji{

font-size:70px;

animation:bounce 1s infinite;

}

@keyframes bounce{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-15px);
}

}

</style>

</head>

<body>

<div class="card">

<div class="emoji">🎉🎁💖</div>

<h1>Thanks 😁</h1>

<h2>Happy Friendship Day en iyi arkadaş 😊</h2>

<p>
Thank you for being an amazing friend.<br>
May our friendship stay strong 😊! 
</p>

<div class="emoji">🌈🥳🎊</div>

</div>

</body>
</html>
